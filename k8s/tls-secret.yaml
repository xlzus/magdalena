# TLS Secret for your custom certificate
#
# Before applying this file, create the secret from your cert files:
#
#   kubectl create secret tls magdalena-docs-tls \
#     --cert=path/to/your/fullchain.pem \
#     --key=path/to/your/privkey.pem \
#     --namespace=docs
#
# Or, if you already have the cert and key as base64-encoded strings,
# fill in the values below and apply with: kubectl apply -f k8s/tls-secret.yaml
#
# To get base64 values:
#   cat fullchain.pem | base64 | tr -d '\n'
#   cat privkey.pem  | base64 | tr -d '\n'

apiVersion: v1
kind: Secret
metadata:
  name: magdalena-docs-tls
  namespace: docs          # must match Deployment namespace
type: kubernetes.io/tls
data:
  tls.crt: <BASE64_ENCODED_FULLCHAIN_CERT>
  tls.key: <BASE64_ENCODED_PRIVATE_KEY>
