site_name: Ministerio Parroquial Santa María Magdalena
nav:
  - esquema pentecostés: pentecostes.md
  - Pentecostés:
      - Piedras Vivas: pentecostes/piedras_vivas.md
      - Esta es el agua: pentecostes/esta_es_el_agua.md
      - Maria: pentecostes/maria.md
      - Por eso Ven: pentecostes/por_eso_ven.md
      - En torno a María: pentecostes/en_torno_a_maria.md
  - Taller Musical:
      - Inicio: taller/index.md
      - Cómo leer los acordes: taller/acordes.md
      - Cuidado de la voz: taller/voz.md
      - Cómo transportar un canto: taller/transportar.md
#   - Historial:
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: light
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
